services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: caisse
      POSTGRES_USER: caisse_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - caisse-postgres:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - caisse

  api:
    build:
      context: .
      dockerfile: src/Caisse.Server/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:5080
      ConnectionStrings__Default: Host=db;Port=5432;Database=caisse;Username=caisse_app;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Jwt__Issuer: Caisse.Server
      Jwt__Audience: Caisse.Client
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-5080}:5080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - caisse

networks:
  caisse:
    driver: bridge

volumes:
  caisse-postgres:
