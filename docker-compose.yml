services:
  db:
    image: postgres:16-alpine
    container_name: caisse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: caisse
      POSTGRES_USER: caisse_app
      POSTGRES_PASSWORD: caisse_dev_only
    ports:
      - "5432:5432"
    volumes:
      - caisse-postgres:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caisse_app -d caisse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caisse-postgres:
